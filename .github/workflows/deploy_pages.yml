name: Build Windows Test App and Deploy Pages

on:
  # The testing branch updates the public test download without changing main.
  push:
    branches:
      - main
      - codex/protocol-v2-testing
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows protocol-v2 test bundle
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release bundle
        run: flutter build windows --release

      - name: Package complete Windows bundle
        shell: pwsh
        run: |
          # Flutter desktop apps need the executable, DLLs, and data directory.
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "AirBoard-Windows-v2-test.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows test artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirBoard-Windows-v2-test
          path: AirBoard-Windows-v2-test.zip
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    name: Publish website and Windows test download
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: AirBoard-Windows-v2-test
          path: dist/releases

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Create static distribution
        shell: bash
        run: |
          # Publish documentation used by the website's source-build links.
          cp index.html dist/
          cp README.md TECHNICAL_DETAILS.md TROUBLESHOOTING.md TESTING.md dist/
          cp -r web_showcase dist/
          if [ -d "assets" ]; then cp -r assets dist/; fi
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
