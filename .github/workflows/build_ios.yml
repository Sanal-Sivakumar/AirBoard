name: Build iPadOS and iOS Test IPA

on:
  push:
    branches:
      - main
      - codex/protocol-v2-testing
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ios-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iPadOS/iOS artifact
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust for physical Apple devices
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify Dart and Flutter code
        run: |
          # Fail before the expensive Apple build if source checks regress.
          flutter analyze
          flutter test

      - name: Build unsigned physical-device app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA container
        shell: bash
        run: |
          # Sideloading software must sign this app before iPadOS can install it.
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/AirBoard.app
          zip -qry AirBoard-iPadOS-v2-unsigned-test.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirBoard-iPadOS-v2-unsigned-test
          path: AirBoard-iPadOS-v2-unsigned-test.ipa
          if-no-files-found: error
          retention-days: 14
